upstream ranking_web {
  server web_a:80;
  server web_b:80;
}

upstream ranking_api {
  server api:3001;
}

server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://ranking_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://ranking_web;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
